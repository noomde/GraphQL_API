type Score {
  metascore: Int
  metascoreCount: Int
  metascoreSentiment: String
  userScore: Float
  userScoreCount: Int
  userScoreSentiment: String
}

type scoresList {
  items: [Score!]!
  totalCount: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

extend type Query {
  scores(page: Int = 1, limit: Int = 50): scoresList!
  score(gameId: Int!): Score
}
