type User {
  id: ID!
  username: String!
  provider: String
  providerId: String
}

type AuthPayload {
  token: String!
}

extend type Mutation {
  registerUser(username: String!, password: String!): User!
  loginUser(username: String!, password: String!): AuthPayload!
  oauthLoginUser(provider: String!, providerId: String!, username: String!): AuthPayLoad!
}
