type Game {
  id: Int!
  metacriticId: Int
  title: String!
  releaseDate: String
  rating: String
  genres: String!
  description: String
  developer: String
  publisher: String

  platforms: [GamePlatform!]!
  scores: Score
}

type Platform {
  id: Int!
  name: String!
}

type GamePlatform {
  id: Int!
  name: String!
  platformMetascore: Int
}

type Score {
  metascore: Int
  metascoreCount: Int
  metascoreSentiment: String
  userScore: Float
  userScoreCount: Int
  userScoreSentiment: String
}

type GameList {
  items: [Game!]!
  totalCount: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

type GameFilterInput {
  genre: String
  platform: String
  developer: String
  publisher: String
}

type DeleteGameResponse {
  message: String!
}

extend type Query {
  games(page: Int = 1, limit: Int = 20, filter: GameFilterInput): GameList!
  game(id: Int!): Game
}

extend type Mutation {
  createGame(
    metacriticId: Int
    title: String!
    releaseDate: String
    rating: String
    genres: String!
    description: String
    developer: String
    publisher: String
  ): Game!

  updateGame(
    id: Int!
    metacriticId: Int
    title: String
    releaseDate: String
    rating: String
    genres: String
    description: String
    developer: String
    publisher: String
  ): Game!

  deleteGame(id: Int!): DeleteGameResponse!
}
