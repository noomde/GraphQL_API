type PlatformAverageScore {
  name: String!
  averageMetascore: Float!
  gameCount: Int!
}

type DeveloperAverageScore {
  name: String!
  averageMetascore: Float
  gameCount: Int!
}

type PublisherAverageScore {
  name: String!
  averageMetascore: Float
  gameCount: Int!
}

extend type Query {
  averageScorePerPlatform: [PlatformAverageScore!]!
  averageScorePerDeveloper: [DeveloperAverageScore!]!
  averageScorePerPublisher: [PublisherAverageScore!]!
}
